<form class="split" id="newOrder" novalidate><div class="col g16">
<div class="card col g12" style="padding:20px"><h3>Dados do cliente</h3>
<div class="grid2" style="grid-template-columns:1fr 1fr;gap:12px"><label class="fld"><span>Nome do cliente</span><span class="input"><input name="name" type="text" placeholder="Ex.: João Silva"  value="" aria-label="Nome do cliente"></span></label><label class="fld"><span>Telefone</span><span class="input"><input name="phone" type="tel" placeholder="(68) 9 0000-0000"  value="" aria-label="Telefone"></span></label></div>
<div class="fld"><span>Recebimento</span><div class="row g10"><label class="opt toggle2"><input class="hidden-input" type="radio" name="rec" value="entrega" checked><span class="box"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 18V6a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v11a1 1 0 0 0 1 1h2"/><path d="M15 18H9"/><path d="M19 18h2a1 1 0 0 0 1-1v-3.65a1 1 0 0 0-.22-.624l-3.48-4.35A1 1 0 0 0 17.52 8H14"/><circle cx="17" cy="18" r="2"/><circle cx="7" cy="18" r="2"/></svg> Entrega</span></label><label class="opt toggle2"><input class="hidden-input" type="radio" name="rec" value="retirada"><span class="box"><svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m2 7 4.41-4.41A2 2 0 0 1 7.83 2h8.34a2 2 0 0 1 1.42.59L22 7"/><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><path d="M15 22v-4a2 2 0 0 0-2-2h-2a2 2 0 0 0-2 2v4"/><path d="M2 7h20"/></svg> Retirada na loja</span></label></div></div>
<div id="addrGrid" class="col g12"><div style="display:grid;grid-template-columns:2fr 110px 1fr;gap:12px"><label class="fld"><span>Endereço</span><span class="input"><input name="address" type="text" placeholder="Rua, avenida..."  value="" aria-label="Endereço"></span></label><label class="fld"><span>Número</span><span class="input"><input name="number" type="text" placeholder="123"  value="" aria-label="Número"></span></label><label class="fld"><span>Bairro</span><span class="input"><input name="district" type="text" placeholder="Centro"  value="" aria-label="Bairro"></span></label></div>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px"><label class="fld"><span>Complemento</span><span class="input"><input name="comp" type="text" placeholder="Apto, bloco..."  value="" aria-label="Complemento"></span></label><label class="fld"><span>Referência</span><span class="input"><input name="ref" type="text" placeholder="Próximo a..."  value="" aria-label="Referência"></span></label></div></div></div>
<div class="card col g10" style="padding:20px"><h3>Itens do pedido</h3>
<div class="tablewrap"><table><thead><tr><th>Produto</th><th>Tamanho</th><th>Borda</th><th>Quantidade</th><th>Preço</th><th></th></tr></thead><tbody id="itemsBody"></tbody></table></div>
<div class="row g10"><button type="button" class="btn dashed grow" id="addPizza"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg> Adicionar pizza</button><button type="button" class="btn dashed grow" id="addDrink"><svg class="ic" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="M12 5v14"/></svg> Adicionar bebida</button></div></div></div>
<div class="card col g12" style="padding:20px;position:sticky;top:28px"><h3>Resumo</h3><div class="col g8" id="summary"></div>
<label class="fld"><span>Observações do pedido</span><textarea class="input" name="obs" placeholder="Ex.: sem cebola, troco para R$ 100..."></textarea></label>
<div class="fld"><span>Pagamento</span><div class="row g6 wrap"><label><input class="hidden-input" type="radio" name="pg" value="Pix" checked><span class="chip">Pix</span></label><label><input class="hidden-input" type="radio" name="pg" value="Dinheiro"><span class="chip">Dinheiro</span></label><label><input class="hidden-input" type="radio" name="pg" value="Cartão"><span class="chip">Cartão</span></label></div></div>
<button class="btn success full lg">Enviar para cozinha</button><a class="btn neutral full" href="pedidos.html">Cancelar</a></div></form></main></div>
